<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduStream - Learning Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            /* Modern deep gradient background */
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 4rem 2rem;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated background blobs for modern vibe */
        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.6;
            animation: float 10s infinite alternate ease-in-out;
        }
        .blob1 { width: 400px; height: 400px; background: #e74c3c; top: -100px; left: -100px; }
        .blob2 { width: 350px; height: 350px; background: #3498db; bottom: -50px; right: -50px; animation-delay: -5s; }
        .blob3 { width: 300px; height: 300px; background: #9b59b6; top: 40%; left: 50%; transform: translate(-50%, -50%); animation-delay: -2s; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 50px) scale(1.1); }
        }

        header {
            text-align: center;
            margin-bottom: 3.5rem;
            width: 100%;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #fff, #b1d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        p.subtitle {
            font-size: 1.2rem;
            color: #b0c4de;
            font-weight: 300;
            padding: 0 10px;
        }

        .tile-container {
            width: 100%;
            max-width: 1100px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
            z-index: 1;
        }

        .tile {
            /* Glassmorphism styling */
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 2rem 1.5rem;
            border-radius: 20px;
            text-align: center;
            text-decoration: none;
            color: #ffffff;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }

        .tile::before {
            content: ""; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0) 100%);
            transform: skewX(-25deg); transition: all 0.6s ease;
        }

        .tile:hover::before { left: 200%; }

        .tile:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 25px 45px rgba(0,0,0,0.4);
            border-color: rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.1);
        }

        .tile-icon {
            width: 70px;
            height: 70px;
            margin-bottom: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            box-shadow: inset 0 0 10px rgba(255,255,255,0.2);
            transition: transform 0.3s ease;
        }

        .tile:hover .tile-icon { transform: scale(1.1) rotate(5deg); }

        .tile-title {
            font-size: 1.6rem;
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }

        .tile-desc {
            font-size: 0.9rem;
            color: #a9bccc;
            font-weight: 300;
        }

        /* Subject Specific Glows */
        .maths:hover { box-shadow: 0 20px 40px rgba(231, 76, 60, 0.3); }
        .maths .tile-icon svg { fill: #e74c3c; }
        .science:hover { box-shadow: 0 20px 40px rgba(46, 204, 113, 0.3); }
        .science .tile-icon svg { fill: #2ecc71; }
        .english:hover { box-shadow: 0 20px 40px rgba(241, 196, 15, 0.3); }
        .english .tile-icon svg { fill: #f1c40f; }
        .hindi:hover { box-shadow: 0 20px 40px rgba(155, 89, 182, 0.3); }
        .hindi .tile-icon svg { fill: #9b59b6; }
        .it:hover { box-shadow: 0 20px 40px rgba(52, 152, 219, 0.3); }
        .it .tile-icon svg { fill: #3498db; }
        .social:hover { box-shadow: 0 20px 40px rgba(230, 126, 34, 0.3); }
        .social .tile-icon svg { fill: #e67e22; }

        /* --- MOBILE & TABLET RESPONSIVENESS --- */
        @media (max-width: 992px) {
            .tile-container { grid-template-columns: repeat(2, 1fr); }
            h1 { font-size: 3rem; }
        }

        @media (max-width: 768px) {
            body { padding: 3rem 1.5rem; }
            h1 { font-size: 2.5rem; margin-bottom: 0.2rem; }
            header { margin-bottom: 2.5rem; }
            .tile-container { gap: 1.5rem; }
        }

        @media (max-width: 480px) {
            body { padding: 2rem 1rem; }
            h1 { font-size: 2rem; }
            p.subtitle { font-size: 1rem; }
            header { margin-bottom: 2rem; }
            .tile-container {
                grid-template-columns: 1fr; /* Single column on phones */
                gap: 1.25rem;
            }
            .tile {
                padding: 1.5rem 1rem;
                border-radius: 16px;
                flex-direction: row; /* Horizontal layout for phone cards */
                text-align: left;
                justify-content: flex-start;
                gap: 1rem;
            }
            .tile-icon {
                width: 55px; height: 55px;
                margin-bottom: 0;
                flex-shrink: 0;
            }
            .tile-icon svg { width: 26px; height: 26px; }
            .tile-title { font-size: 1.3rem; margin-bottom: 0.2rem; }
            .tile-desc { font-size: 0.85rem; }
        }
    </style>
</head>
<body>

    <!-- Animated Background Blobs -->

    <div class="blob blob2"></div>
    <div class="blob blob3"></div>

    </div>

</body>
</html>
